name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # types first: it is the fastest gate and catches broken imports
      - run: npx tsc --noEmit

      - run: npm test

      # the Python validator is the original check; npm test is its TS twin
      - run: python3 reference/scripts/validate_seed.py
